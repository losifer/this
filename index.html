<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This Is Carlos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #4a2c3d;
      color: #f3e9d7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Bebas Neue", sans-serif;
      text-align: center;
      padding: 16px;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      position: relative;
      z-index: 2;
      transition: opacity 0.5s ease;
      font-weight: 400;
      font-size: clamp(3rem, 14vw, 12rem);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 2px 30px rgba(20, 8, 16, 0.45);
      pointer-events: none;
    }
    /* Once WebGL draws the text, keep the heading for screen readers only */
    .gl-on h1 {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .on-page h1 { opacity: 0; }
    .nav {
      position: fixed;
      top: clamp(16px, 3vw, 32px);
      right: clamp(16px, 3.5vw, 40px);
      z-index: 3;
    }
    .nav ul {
      display: flex;
      gap: clamp(16px, 2.5vw, 36px);
      list-style: none;
    }
    .nav a {
      position: relative;
      color: #f3e9d7;
      text-decoration: none;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.01em;
      opacity: 0.8;
      text-shadow: 0 1px 12px rgba(20, 8, 16, 0.45);
      transition: opacity 0.25s ease;
    }
    .nav a::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { opacity: 1; }
    .nav a:hover::after, .nav a:focus-visible::after, .nav a[aria-current="page"]::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    .nav a:focus-visible { outline: 1px solid rgba(243, 233, 215, 0.6); outline-offset: 4px; }
    #oil {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Inner pages sit beneath the oil canvas, which peels away to reveal them */
    .page {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow-y: auto;
      touch-action: pan-y;
      background: #2a1421;
      text-align: left;
      font-family: "Inter", system-ui, sans-serif;
      padding: clamp(72px, 12vh, 132px) clamp(16px, 3.5vw, 40px) 64px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0s linear 0.5s;
    }
    .page.is-active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease;
    }
    /* with WebGL the canvas does the revealing, so the page is just there */
    .gl-on .page, .gl-on .page.is-active { transition: none; }
    /* content fades and scales in as the splash peels away, and back out
       (no delay) as the splash returns */
    .page-inner {
      max-width: 960px;
      opacity: 0;
      /* hidden state sits lower: rises up on the way in, sinks on the way out */
      transform: translateY(32px) scale(0.88);
      transform-origin: 50% 30%;
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* is-shown is added by JS once the peel has uncovered most of the page */
    .page.is-shown .page-inner {
      opacity: 1;
      transform: none;
      /* ease out with a slight bounce: overshoots a touch, then settles */
      transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .page-inner, .page.is-shown .page-inner { transform: none; transition-duration: 0.01s; transition-delay: 0s; }
    }
    .page-head {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 24px);
      margin-bottom: clamp(28px, 5vh, 56px);
    }
    .back {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      border-radius: 50%;
      color: #f3e9d7;
      border: 1px solid rgba(243, 233, 215, 0.25);
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }
    .back:hover, .back:focus-visible {
      background: rgba(243, 233, 215, 0.08);
      border-color: rgba(243, 233, 215, 0.6);
      transform: translateX(-2px);
    }
    .back:focus-visible { outline: 1px solid rgba(243, 233, 215, 0.6); outline-offset: 4px; }
    .page-title {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      outline: none;
    }
    .block {
      border-radius: 16px;
      background: rgba(243, 233, 215, 0.035);
      border: 1px solid rgba(243, 233, 215, 0.08);
      padding: clamp(20px, 3vw, 40px);
      color: rgba(243, 233, 215, 0.75);
      font-size: 1rem;
      line-height: 1.6;
    }
    .block p { max-width: 60ch; }
    .skeleton { margin-top: 24px; display: grid; gap: 12px; }
    .skeleton span {
      display: block;
      height: 10px;
      border-radius: 5px;
      background: rgba(243, 233, 215, 0.07);
    }
    .skeleton span:nth-child(2) { width: 85%; }
    .skeleton span:nth-child(3) { width: 60%; }
  </style>
</head>
<body>
  <canvas id="oil" aria-hidden="true"></canvas>
  <nav class="nav" aria-label="Main">
    <ul>
      <li><a href="#about">Carlos</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <h1>This Is Carlos</h1>

  <main>
    <section class="page" id="page-about" data-page="about" aria-labelledby="title-about">
      <div class="page-inner">
        <header class="page-head">
          <a class="back" href="#" aria-label="Back to home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          </a>
          <h2 class="page-title" id="title-about" tabindex="-1">Carlos</h2>
        </header>
        <div class="block">
          <p>Placeholder — a few lines about Carlos will go here.</p>
          <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>

    <section class="page" id="page-projects" data-page="projects" aria-labelledby="title-projects">
      <div class="page-inner">
        <header class="page-head">
          <a class="back" href="#" aria-label="Back to home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          </a>
          <h2 class="page-title" id="title-projects" tabindex="-1">Projects</h2>
        </header>
        <div class="block">
          <p>Placeholder — selected projects will go here.</p>
          <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>
  </main>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  </script>

  <!-- Shared helpers: sim state is (velocity.xy, offset.zw). With 8-bit
       textures we store it biased into 0..1. -->
  <script id="common" type="x-shader/x-fragment">
    precision highp float;
    varying vec2 vUv;
    uniform float uEnc;
    const vec4 RANGE = vec4(4.0, 4.0, 0.5, 0.5);
    vec4 decode(vec4 s) { return uEnc > 0.5 ? (s - 0.5) * 2.0 * RANGE : s; }
    vec4 encode(vec4 s) { return uEnc > 0.5 ? clamp(s / RANGE * 0.5 + 0.5, 0.0, 1.0) : s; }
  </script>

  <!-- Pass 1: a cheap fluid-ish field the pointer pushes around -->
  <script id="sim" type="x-shader/x-fragment">
    uniform sampler2D uPrev;
    uniform vec2 uMouse;        // uv, y up
    uniform vec2 uMouseVel;     // uv per second
    uniform float uForce;       // 1 when the pointer moved this frame
    uniform float uAspect;
    uniform float uDt;
    uniform float uVelDecay;
    uniform float uOffDecay;
    uniform vec2 uTexel;

    vec4 at(vec2 uv) { return decode(texture2D(uPrev, uv)); }

    void main() {
      vec4 here = at(vUv);
      // semi-Lagrangian advection: carry the state along its own velocity,
      // with a little diffusion so smears stay soft and liquid
      vec2 b = vUv - here.xy * uDt;
      vec2 tx = vec2(uTexel.x, 0.0), ty = vec2(0.0, uTexel.y);
      vec4 s = (at(b) * 4.0 + at(b + tx) + at(b - tx) + at(b + ty) + at(b - ty)) / 8.0;
      vec2 vel = s.xy * uVelDecay;
      vec2 off = s.zw * uOffDecay + vel * uDt;

      vec2 d = (vUv - uMouse) * vec2(uAspect, 1.0);
      float g = exp(-dot(d, d) / 0.012) * uForce;
      vel = mix(vel, uMouseVel * 0.35, g * 0.45);

      float m = length(vel);
      if (m > 2.0) vel *= 2.0 / m;
      off = clamp(off, -0.45, 0.45);
      gl_FragColor = encode(vec4(vel, off));
    }
  </script>

  <!-- Pass 2: the mouse trail — stamped along the pointer's path, carried by
       the flow and fading out. Stored raw (0..1), not encoded. -->
  <script id="trailfs" type="x-shader/x-fragment">
    uniform sampler2D uPrev;
    uniform sampler2D uSim;
    uniform vec2 uMouse;
    uniform vec2 uMousePrev;
    uniform float uForce;
    uniform float uAspect;
    uniform float uDt;
    uniform float uDecay;
    uniform float uTime;
    uniform vec2 uTexel;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }

    void main() {
      vec2 vel = decode(texture2D(uSim, vUv)).xy;
      // carried by the flow, plus a slow wobble so it creeps like liquid
      vec2 asp = vec2(uAspect, 1.0);
      vec2 q = vUv * asp * 6.0 + uTime * 0.3;
      vec2 wob = (vec2(noise(q), noise(q + 17.3)) - 0.5) * uTexel * 1.5;
      vec2 b = vUv - vel * uDt - wob;

      // spread a little each frame so the stroke pools and softens
      vec2 tx = vec2(uTexel.x, 0.0), ty = vec2(0.0, uTexel.y);
      float v = (texture2D(uPrev, b).r * 4.0
               + texture2D(uPrev, b + tx).r + texture2D(uPrev, b - tx).r
               + texture2D(uPrev, b + ty).r + texture2D(uPrev, b - ty).r) / 8.0;
      // subtract a little too, so 8-bit fallbacks still fade all the way out
      v = v * uDecay - 0.0025;

      // distance to the segment the pointer covered this frame, so fast
      // strokes leave a continuous line rather than dots
      vec2 a0 = uMousePrev * asp, b0 = uMouse * asp;
      vec2 p = vUv * asp, ab = b0 - a0;
      float h = clamp(dot(p - a0, ab) / max(dot(ab, ab), 1e-8), 0.0, 1.0);
      vec2 d = p - a0 - ab * h;
      // uneven, blobby edges rather than a clean tube
      float r = 0.0012 * (0.55 + 0.9 * noise(p * 14.0 + uTime));
      float stamp = exp(-dot(d, d) / r) * uForce;

      gl_FragColor = vec4(clamp(v + stamp * (1.0 - v), 0.0, 1.0), 0.0, 0.0, 1.0);
    }
  </script>

  <!-- Pass 3: the oil slick, sampled through the pushed-around offsets -->
  <script id="oilfs" type="x-shader/x-fragment">
    uniform sampler2D uSim;
    uniform sampler2D uTrail;
    uniform sampler2D uText;    // r = text, g = soft shadow
    uniform float uAspect;
    uniform float uTime;
    uniform vec2 uTrailTexel;
    uniform float uReveal;      // 0 = splash fully there, 1 = peeled away
    uniform vec2 uOrigin;       // uv the peel starts from

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
      for (int i = 0; i < 4; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
      return v;
    }
    float oil(vec2 p) {
      float t = uTime * 0.025;
      vec2 w = vec2(fbm(p + vec2(t, -t * 0.7)), fbm(p + vec2(5.2, 1.3) - t));
      return fbm(p + 2.2 * w);
    }

    void main() {
      // page transition: the splash melts away from the click point along an
      // oily, noise-shaped front, warping everything as it goes
      vec2 asp = vec2(uAspect, 1.0);
      vec2 uv = vUv;
      float keep = 1.0, edge = 0.0;
      vec2 rw = vec2(0.0);
      if (uReveal > 0.0) {
        vec2 rq = vUv * asp * 2.2;
        rw = vec2(fbm(rq + uTime * 0.08), fbm(rq + vec2(4.7, 1.9) - uTime * 0.08)) - 0.5;
        float dist = length((vUv - uOrigin) * asp) / length(asp);
        float field = dist * 0.65 + fbm(rq * 1.3 + rw * 2.5) * 0.55;
        float thr = mix(-0.2, 1.25, uReveal);
        keep = smoothstep(thr, thr + 0.14, field);
        edge = 1.0 - abs(keep * 2.0 - 1.0);
        float k = sin(3.14159 * clamp(uReveal, 0.0, 1.0));
        uv += rw * (0.05 * k + 0.14 * edge * (1.0 - keep * 0.5));
      }

      vec4 s = decode(texture2D(uSim, uv));

      // the trail is a thin liquid layer: treat it as a height field and
      // get its surface normal, which we use to refract what's beneath
      vec2 ttx = vec2(uTrailTexel.x, 0.0) * 1.5, tty = vec2(0.0, uTrailTexel.y) * 1.5;
      float tr = texture2D(uTrail, uv).r;
      vec2 tg = vec2(texture2D(uTrail, uv + ttx).r - texture2D(uTrail, uv - ttx).r,
                     texture2D(uTrail, uv + tty).r - texture2D(uTrail, uv - tty).r);
      vec3 tn = normalize(vec3(-tg * 2.2, 1.0));
      vec2 refr = tn.xy * 0.035;

      // larger, softer swirls
      vec2 p = (uv - s.zw - refr) * asp * 1.1;

      float e = 0.012;
      float o = oil(p), ox = oil(p + vec2(e, 0.0)), oy = oil(p + vec2(0.0, e));
      vec3 n = normalize(vec3(-(ox - o) / e * 0.06, -(oy - o) / e * 0.06, 1.0));

      // stirred oil shifts its interference colours, gently
      float stir = clamp(length(s.xy) * 0.35 + length(s.zw) * 1.0, 0.0, 1.0);
      float phase = o * 1.8 + (1.0 - n.z) * 2.0 + stir * 0.5;
      vec3 film = 0.5 + 0.5 * cos(6.28318 * (phase + vec3(0.0, 0.33, 0.67)));
      film = mix(vec3(dot(film, vec3(0.333))), film, 0.4);

      float sheen = smoothstep(0.35, 0.8, o) + stir * 0.25;
      vec3 L = normalize(vec3(-0.4, 0.5, 0.75));
      float spec = pow(max(dot(n, normalize(L + vec3(0.0, 0.0, 1.0))), 0.0), 24.0);

      vec3 base = vec3(0.290, 0.173, 0.239);       // #4a2c3d
      vec3 col = base * (0.8 + 0.15 * n.z) + film * (0.04 + 0.1 * sheen) + spec * 0.06;

      // mouse trail: a fresh slick of oil — refracts what's beneath (above),
      // with the oil's own interference colours and glossy shine
      float slope = 1.0 - tn.z;
      float body = smoothstep(0.02, 0.45, tr);

      // the oil's surface plus the trail's, so the shine follows both
      vec3 nc = normalize(vec3(n.xy * 1.5 + tn.xy, 1.0));

      // thin-film colour: the same palette as the oil, but its thickness
      // (the trail height) and curvature push the bands around
      float tphase = phase + tr * 1.3 + slope * 2.5;
      vec3 tfilm = 0.5 + 0.5 * cos(6.28318 * (tphase + vec3(0.0, 0.33, 0.67)));
      tfilm = mix(vec3(dot(tfilm, vec3(0.333))), tfilm, 0.8);

      vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
      float tspec = pow(max(dot(nc, H), 0.0), 40.0);
      float wet = pow(max(dot(tn, H), 0.0), 90.0) * smoothstep(0.0, 0.06, slope);
      float tsheen = smoothstep(0.25, 0.75, o) * 0.5 + 0.5;

      vec3 slick = base * (0.55 + 0.25 * nc.z)
                 + tfilm * (0.16 + 0.26 * tsheen)
                 + tspec * 0.3 + wet * 0.4;
      col = mix(col, slick, body);

      // the text rides the same flow as the oil, so it smears with it
      // (and bends under the trail, like looking through water)
      vec2 t = texture2D(uText, uv - s.zw - refr).rg;
      col = mix(col, col * 0.5, t.g * 0.5);
      col = mix(col, vec3(0.953, 0.914, 0.843), t.r);   // cream #f3e9d7

      // the melting front gets a bright, oily iridescent rim
      if (uReveal > 0.0) {
        vec3 rim = 0.5 + 0.5 * cos(6.28318 * (o * 2.0 + rw.x * 3.0 + edge + vec3(0.0, 0.33, 0.67)));
        rim = mix(vec3(dot(rim, vec3(0.333))), rim, 0.8);
        col = mix(col, base * 0.6 + rim * 0.45, edge * 0.85);
      }
      gl_FragColor = vec4(col * keep, keep);   // premultiplied
    }
  </script>

  <script>
  (function () {
    const canvas = document.getElementById('oil');
    // transparent canvas: the inner pages underneath show through as it peels
    const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) return; // the plain plum background stays

    const src = id => document.getElementById(id).textContent;
    function program(fsId) {
      const make = (type, text) => {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, text);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        return sh;
      };
      const p = gl.createProgram();
      gl.attachShader(p, make(gl.VERTEX_SHADER, src('vs')));
      gl.attachShader(p, make(gl.FRAGMENT_SHADER, src('common') + src(fsId)));
      gl.bindAttribLocation(p, 0, 'aPos');
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const name = gl.getActiveUniform(p, i).name;
        u[name] = gl.getUniformLocation(p, name);
      }
      return { p, u };
    }

    let simProg, trailProg, oilProg;
    try { simProg = program('sim'); trailProg = program('trailfs'); oilProg = program('oilfs'); }
    catch (err) { console.error(err); return; }

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // Prefer half-float sim textures; fall back to 8-bit encoding.
    const hf = gl.getExtension('OES_texture_half_float');
    const hfLinear = gl.getExtension('OES_texture_half_float_linear');
    let texType = gl.UNSIGNED_BYTE, enc = 1, filter = gl.LINEAR;

    function makeTarget(w, h, type, filt) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return ok ? { tex, fb } : null;
    }

    if (hf) {
      const probe = makeTarget(4, 4, hf.HALF_FLOAT_OES, hfLinear ? gl.LINEAR : gl.NEAREST);
      if (probe) {
        texType = hf.HALF_FLOAT_OES; enc = 0; filter = hfLinear ? gl.LINEAR : gl.NEAREST;
        gl.deleteTexture(probe.tex); gl.deleteFramebuffer(probe.fb);
      }
    }

    let sims = [], trails = [], simW = 0, simH = 0, aspect = 1, textReady = false;

    const textTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));

    // Draw the heading into a full-screen texture: text in red, shadow in green
    function buildText() {
      const W = canvas.width, H = canvas.height, k = W / innerWidth;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      x.fillStyle = '#000';
      x.fillRect(0, 0, W, H);

      const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      const font = Math.max(3 * rem, Math.min(12 * rem, innerWidth * 0.14)) * k;
      x.font = `400 ${font}px "Bebas Neue", sans-serif`;
      if ('letterSpacing' in x) x.letterSpacing = `${font * 0.02}px`;
      x.textAlign = 'center';
      x.textBaseline = 'alphabetic';
      const text = document.querySelector('h1').textContent.toUpperCase();
      const m = x.measureText(text);
      const asc = m.actualBoundingBoxAscent || font * 0.7;
      const desc = m.actualBoundingBoxDescent || 0;
      const y = H / 2 + (asc - desc) / 2;

      // shadow only, via an offscreen draw
      x.fillStyle = '#0f0';
      x.shadowColor = '#0f0';
      x.shadowBlur = 30 * k;
      x.shadowOffsetX = W * 2;
      x.shadowOffsetY = 2 * k;
      x.fillText(text, W / 2 - W * 2, y);

      x.shadowColor = 'transparent';
      x.globalCompositeOperation = 'lighter';
      x.fillStyle = '#f00';
      x.fillText(text, W / 2, y);

      gl.bindTexture(gl.TEXTURE_2D, textTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    }

    function resize() {
      // a bit above 1x so the text stays crisp without making the oil too costly
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      aspect = canvas.width / canvas.height;
      simW = Math.max(32, Math.round(canvas.width / 4));
      simH = Math.max(32, Math.round(canvas.height / 4));
      sims.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); });
      sims = [makeTarget(simW, simH, texType, filter), makeTarget(simW, simH, texType, filter)];
      const zero = enc ? 0.5 : 0;
      sims.forEach(t => {
        gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
        gl.clearColor(zero, zero, zero, zero);
        gl.clear(gl.COLOR_BUFFER_BIT);
      });
      trails.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); });
      trails = [makeTarget(simW, simH, texType, filter), makeTarget(simW, simH, texType, filter)];
      trails.forEach(t => {
        gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      });
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      if (textReady) buildText();
    }
    resize();
    (document.fonts ? document.fonts.load('400 100px "Bebas Neue"') : Promise.resolve())
      .catch(() => {})
      .then(() => {
        textReady = true;
        buildText();
        document.body.classList.add('gl-on');
      });
    window.addEventListener('resize', resize);

    // Pointer, in uv with y up
    const ptr = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, moved: false, seen: false };
    window.addEventListener('pointermove', e => {
      const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
      if (!ptr.seen) { ptr.px = x; ptr.py = y; ptr.seen = true; }
      ptr.x = x; ptr.y = y; ptr.moved = true;
    });
    window.addEventListener('pointerdown', e => {
      ptr.px = ptr.x = e.clientX / innerWidth;
      ptr.py = ptr.y = 1 - e.clientY / innerHeight;
      ptr.seen = true;
    });

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let last = performance.now(), cur = 0;

    // Page transition: tween uReveal between 0 (splash) and 1 (peeled away)
    const rv = { value: 0, from: 0, to: 0, start: 0, dur: 0, done: null, ox: 0.5, oy: 0.5 };
    const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    window.oilFx = {
      // origin in client px; done fires only if this transition isn't superseded
      transition(to, origin, done) {
        if (origin) { rv.ox = origin.x / innerWidth; rv.oy = 1 - origin.y / innerHeight; }
        rv.from = rv.value; rv.to = to; rv.start = performance.now();
        rv.dur = reduceMotion ? 0 : 1500 * Math.abs(to - rv.value);
        rv.done = done || null;
        if (rv.value === to) { rv.done = null; if (done) done(); }
        return rv.dur;
      },
      set(v) { rv.value = rv.from = rv.to = v; rv.dur = 0; rv.done = null; },
    };
    function stepReveal(now) {
      if (rv.value === rv.to) return;
      const t = rv.dur > 0 ? Math.min((now - rv.start) / rv.dur, 1) : 1;
      rv.value = rv.from + (rv.to - rv.from) * ease(t);
      if (t >= 1) {
        rv.value = rv.to;
        const d = rv.done; rv.done = null;
        if (d) d();
      }
    }

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 20);
      last = now;
      if (!reduceMotion) cur += dt;
      stepReveal(now);

      let vx = 0, vy = 0;
      if (ptr.moved && dt > 0) {
        vx = (ptr.x - ptr.px) / dt;
        vy = (ptr.y - ptr.py) / dt;
      }

      // sim step
      gl.useProgram(simProg.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, sims[1].fb);
      gl.viewport(0, 0, simW, simH);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sims[0].tex);
      const su = simProg.u;
      gl.uniform1i(su.uPrev, 0);
      gl.uniform1f(su.uEnc, enc);
      gl.uniform2f(su.uMouse, ptr.x, ptr.y);
      gl.uniform2f(su.uMouseVel, vx, vy);
      gl.uniform1f(su.uForce, ptr.moved ? 1 : 0);
      gl.uniform1f(su.uAspect, aspect);
      gl.uniform1f(su.uDt, dt);
      gl.uniform2f(su.uTexel, 1 / simW, 1 / simH);
      gl.uniform1f(su.uVelDecay, Math.pow(0.95, dt * 60));
      gl.uniform1f(su.uOffDecay, Math.pow(0.99, dt * 60));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      sims.reverse();

      // trail step
      gl.useProgram(trailProg.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, trails[1].fb);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, trails[0].tex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, sims[0].tex);
      const tu = trailProg.u;
      gl.uniform1i(tu.uPrev, 0);
      gl.uniform1i(tu.uSim, 1);
      gl.uniform1f(tu.uEnc, enc);
      gl.uniform2f(tu.uMouse, ptr.x, ptr.y);
      gl.uniform2f(tu.uMousePrev, ptr.px, ptr.py);
      gl.uniform1f(tu.uForce, ptr.moved ? 1 : 0);
      gl.uniform1f(tu.uAspect, aspect);
      gl.uniform1f(tu.uDt, dt);
      gl.uniform1f(tu.uDecay, Math.pow(0.975, dt * 60));
      gl.uniform1f(tu.uTime, cur);
      gl.uniform2f(tu.uTexel, 1 / simW, 1 / simH);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      trails.reverse();

      // oil (or nothing at all, once it's fully peeled away)
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (rv.value >= 1) {
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        ptr.px = ptr.x; ptr.py = ptr.y; ptr.moved = false;
        requestAnimationFrame(frame);
        return;
      }
      gl.useProgram(oilProg.p);
      const ou = oilProg.u;
      gl.uniform1f(ou.uReveal, rv.value);
      gl.uniform2f(ou.uOrigin, rv.ox, rv.oy);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sims[0].tex);
      gl.uniform1i(ou.uSim, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, textTex);
      gl.uniform1i(ou.uText, 1);
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D, trails[0].tex);
      gl.uniform1i(ou.uTrail, 2);
      gl.uniform2f(ou.uTrailTexel, 1 / simW, 1 / simH);
      gl.activeTexture(gl.TEXTURE0);
      gl.uniform1f(ou.uEnc, enc);
      gl.uniform1f(ou.uAspect, aspect);
      gl.uniform1f(ou.uTime, cur);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      ptr.px = ptr.x; ptr.py = ptr.y; ptr.moved = false;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>

  <!-- Hash routing between the splash and the inner pages -->
  <script>
  (function () {
    const pages = new Map([...document.querySelectorAll('.page')].map(el => [el.dataset.page, el]));
    const navLinks = [...document.querySelectorAll('.nav a')];
    const splash = document.querySelector('h1');
    let current = 'home';
    let lastPress = null;

    // remember where the user clicked, so the peel starts from there
    document.addEventListener('pointerdown', e => {
      lastPress = { x: e.clientX, y: e.clientY, t: performance.now() };
    });
    const origin = () =>
      lastPress && performance.now() - lastPress.t < 1500
        ? lastPress
        : { x: innerWidth / 2, y: innerHeight / 2 };

    function setActivePage(name) {
      pages.forEach((el, key) => el.classList.toggle('is-active', key === name));
    }
    let showTimer = 0;
    function hideContent() {
      clearTimeout(showTimer);
      pages.forEach(el => el.classList.remove('is-shown'));
    }

    function show(next, instant) {
      const fx = window.oilFx;
      navLinks.forEach(a => {
        if (a.getAttribute('href') === '#' + next) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });

      if (next === 'home') {
        document.body.classList.remove('on-page');
        splash.removeAttribute('aria-hidden');
        if (document.activeElement && document.activeElement.closest('.page')) document.activeElement.blur();
        // content fades/scales out while the splash flows back over the page,
        // which stays underneath until it's fully covered
        hideContent();
        const finish = () => setActivePage(null);
        if (fx && !instant) fx.transition(0, origin(), finish);
        else { if (fx) fx.set(0); finish(); }
      } else {
        // fade/scale the content in (re-triggered when switching page to page)
        const el = pages.get(next);
        hideContent();
        setActivePage(next);
        void el.offsetWidth;
        document.body.classList.add('on-page');
        splash.setAttribute('aria-hidden', 'true');
        let dur = 0;
        if (fx && !instant) dur = fx.transition(1, origin());
        else if (fx) fx.set(1);
        // start the content's entrance about halfway through the peel, so
        // it's visibly scaling in rather than finishing under the splash
        showTimer = setTimeout(() => el.classList.add('is-shown'), dur * 0.5);
        el.querySelector('.page-title').focus({ preventScroll: true });
      }
      current = next;
    }

    function route(instant) {
      const h = location.hash.slice(1);
      const next = h === '' ? 'home' : pages.has(h) ? h : null;
      if (next === null || next === current) return; // e.g. #contact: nothing yet
      show(next, instant);
    }

    window.addEventListener('hashchange', () => route(false));
    route(true);
  })();
  </script>
</body>
